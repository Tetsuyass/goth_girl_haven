    <main class="inscription-section">
        <h1>Rejoins le cercle</h1>
        <form class="inscription-form">
            <label for="pseudo">Nom d'invocation</label>
            <input type="text" id="pseudo" name="pseudo" placeholder="ex : Nocturna" required />

            <label for="email">Corbeau numérique (email)</label>
            <input type="email" id="email" name="email" placeholder="ex : vampire@outlook.com" required />

            <label for="password">Mot de passe crypté</label>
            <input type="password" id="password" name="password" required />

            <label for="description">Description de ta noirceur</label>
            <textarea id="description" name="description" rows="4" placeholder="Dis-nous qui tu es dans l'ombre..." required></textarea>

            <button type="submit">Invoquer mon profil</button>
        </form>
    </main>
